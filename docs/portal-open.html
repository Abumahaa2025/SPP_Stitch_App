<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPP — فتح البوابة</title>
  <style>
    :root {
      --bg: #050A12;
      --gold: #D4AF37;
      --emerald: #10B981;
      --text: #F3F4F6;
      --dim: #9CA3AF;
      --card: rgba(255,255,255,0.04);
      --border: rgba(212,175,55,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, rgba(212,175,55,0.18), transparent),
                  radial-gradient(900px 500px at 10% 110%, rgba(16,185,129,0.12), transparent),
                  var(--bg);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      backdrop-filter: blur(8px);
    }
    .eyebrow { color: var(--gold); font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; margin: 0 0 8px; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
    .meta { color: var(--dim); font-size: 14px; line-height: 1.6; margin: 0 0 18px; }
    .row { margin: 6px 0; font-size: 14px; }
    .label { color: var(--dim); }
    .value { color: var(--text); font-weight: 600; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    a.btn, button.btn {
      display: block; text-align: center; text-decoration: none; border: 0; cursor: pointer;
      padding: 14px 16px; border-radius: 12px; font-size: 15px; font-weight: 700;
    }
    .primary { background: var(--emerald); color: #04110C; }
    .secondary { background: transparent; color: var(--gold); border: 1px solid var(--border); }
    .hint { margin-top: 14px; color: var(--dim); font-size: 12px; line-height: 1.5; }
    .ok { color: var(--emerald); font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <p class="eyebrow">Smart Property Platform</p>
    <h1 id="title">بوابة SPP</h1>
    <p class="meta" id="subtitle">جاري تجهيز الرابط…</p>
    <div id="details"></div>
    <div class="actions">
      <a class="btn primary" id="openApp" href="#">فتح في تطبيق SPP</a>
      <a class="btn secondary" id="intentApp" href="#">فتح مباشر (Android)</a>
    </div>
    <p class="hint" id="hint">
      إذا لم يفتح التطبيق تلقائياً، ثبّت SPP Stitch ثم اضغط «فتح في تطبيق SPP».
    </p>
    <p class="ok" id="status" hidden>تم إرسال أمر الفتح إلى التطبيق.</p>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var role = (q.get('role') || 'tenant').toLowerCase();
      var id = q.get('id') || '';
      var t = q.get('t') || '';
      var name = q.get('n') || q.get('name') || '';
      var unit = q.get('u') || q.get('unit') || '';
      var prop = q.get('prop') || '';

      var titles = {
        tenant: { ar: 'بوابة المستأجر', en: 'Tenant portal' },
        tech: { ar: 'بوابة الفني', en: 'Technician portal' },
        agent: { ar: 'بوابة الوكيل', en: 'Agent portal' }
      };
      var title = (titles[role] || titles.tenant).ar;
      document.getElementById('title').textContent = title;
      document.getElementById('subtitle').textContent = name
        ? ('مرحباً، ' + name)
        : 'اضغط لفتح بوابتك في تطبيق SPP';

      var details = document.getElementById('details');
      var rows = [];
      if (name) rows.push(['الاسم', name]);
      if (unit) rows.push(['الوحدة', unit]);
      if (prop) rows.push(['العقار', prop]);
      if (role) rows.push(['النوع', role === 'tech' ? 'فني' : role === 'agent' ? 'وكيل' : 'مستأجر']);
      details.innerHTML = rows.map(function (r) {
        return '<div class="row"><span class="label">' + r[0] + ': </span><span class="value">' + r[1] + '</span></div>';
      }).join('');

      var path = role === 'tech'
        ? ('/portal/tech' + (id ? ('?id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t)) : ('?t=' + encodeURIComponent(t))))
        : role === 'agent'
          ? ('/portal/agent?id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t))
          : ('/portal/tenant?id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t));

      // Preserve guest display fields for in-app hydration
      var extra = [];
      if (name) extra.push('n=' + encodeURIComponent(name));
      if (unit) extra.push('u=' + encodeURIComponent(unit));
      if (prop) extra.push('prop=' + encodeURIComponent(prop));
      if (extra.length) path += (path.indexOf('?') >= 0 ? '&' : '?') + extra.join('&');

      var deep = 'spp:/' + path;
      var intent = 'intent://' + path.replace(/^\//, '') +
        '#Intent;scheme=spp;package=ai.spp.stitch;S.browser_fallback_url=' +
        encodeURIComponent(location.href) + ';end';

      var openApp = document.getElementById('openApp');
      var intentApp = document.getElementById('intentApp');
      openApp.href = deep;
      intentApp.href = intent;

      function tryOpen() {
        document.getElementById('status').hidden = false;
        // Prefer custom scheme; Android Chrome often needs intent://
        var isAndroid = /Android/i.test(navigator.userAgent);
        window.location.href = isAndroid ? intent : deep;
      }

      openApp.addEventListener('click', function (e) {
        e.preventDefault();
        tryOpen();
      });
      intentApp.addEventListener('click', function (e) {
        e.preventDefault();
        window.location.href = intent;
      });

      // Auto-attempt once
      setTimeout(tryOpen, 350);
    })();
  </script>
</body>
</html>
