# DEPRECATED — do not auto-publish from this workflow.
# Canonical OTA publisher: .github/workflows/expo-ota-update.yml (push to main → channel beta).
# Kept as manual workflow_dispatch only for emergency republish from a chosen ref.
name: EAS OTA Beta (manual fallback)

"on":
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch to publish from (canonical is main)'
        required: false
        default: 'main'
      message:
        description: 'Update message'
        required: false
        default: 'SPP beta OTA (manual fallback)'

concurrency:
  group: eas-ota-beta-manual
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN secret. Add it under Repo → Settings → Secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Publish EAS Update to channel beta
        env:
          EXPO_PUBLIC_BETA_MODE: 'true'
          EXPO_PUBLIC_BACKEND_URL: https://spp-beta-api.onrender.com
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          MSG="${{ github.event.inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="SPP ${VERSION} OTA — ${GITHUB_SHA::7}"
          fi
          eas update \
            --channel beta \
            --message "$MSG" \
            --non-interactive
          echo "## EAS OTA published (manual fallback)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prefer automatic: expo-ota-update.yml on main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Channel: \`beta\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime (appVersion): \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
