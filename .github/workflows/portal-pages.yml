# Publish docs/portal-open.html to GitHub Pages (optional long-term HTML host).
# One-time: Repo → Settings → Pages → Source = GitHub Actions.
name: Portal Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/portal-open.html'
      - '.github/workflows/portal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portal-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage portal HTML
        run: |
          mkdir -p _site
          cp docs/portal-open.html _site/portal-open.html
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=portal-open.html" /></head><body></body></html>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
