# Publish docs/portal-open.html to GitHub Pages as real text/html.
# Raw GitHub mirrors serve .html as text/plain, which breaks portal deep links.
# One-time: Repo → Settings → Pages → Source = GitHub Actions.
name: Portal Pages

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/portal-open.html'
      - '.github/workflows/portal-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portal-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage portal HTML
        run: |
          mkdir -p _site
          cp docs/portal-open.html _site/portal-open.html
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=portal-open.html" /></head><body></body></html>' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify bridge content type
        run: |
          BRIDGE="${{ steps.deployment.outputs.page_url }}portal-open.html"
          echo "Bridge: $BRIDGE"
          CT=$(curl -sSL -o /dev/null -w '%{content_type}' "$BRIDGE")
          echo "Content-Type: $CT"
          case "$CT" in
            text/html*) echo "OK — bridge renders as HTML." ;;
            *) echo "::error::Bridge served as '$CT' — portal links would show source code."; exit 1 ;;
          esac

      - name: Summary
        run: |
          echo "## Portal bridge published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bridge: ${{ steps.deployment.outputs.page_url }}portal-open.html" >> "$GITHUB_STEP_SUMMARY"
