# Standalone SPP Beta APK â€” embeds JS bundle (NOT Metro/Emergent debug shell).
name: Expo Beta APK (branch)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch'
        required: false
        default: 'main'
      note:
        description: 'Build note (optional)'
        required: false
        default: 'Standalone SPP release APK'
      commit_sha:
        description: 'Short commit for APK filename (optional)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk-github.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CI: true
      NODE_ENV: production
      EXPO_PUBLIC_BETA_MODE: 'true'
      EXPO_PUBLIC_BACKEND_URL: https://spp-beta-api.onrender.com
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Enable swap (prevents OOM during native build)
        working-directory: ${{ github.workspace }}
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Resolve APK identity
        id: meta
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          PKG=$(node -p "require('./app.json').expo.android.package")
          SHORT="${{ github.event.inputs.commit_sha }}"
          if [ -z "$SHORT" ]; then SHORT=$(git rev-parse --short=7 HEAD); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "apk_name=spp-stitch-${SHORT}.apk" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved package=$PKG version=$VERSION short=$SHORT"

      - name: Prebuild Android (clean native project)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_BETA_MODE: 'true'
          EXPO_PUBLIC_BACKEND_URL: https://spp-beta-api.onrender.com

      - name: Patch release to use debug keystore (beta CI)
        run: node ./scripts/patch-android-release-signing.mjs

      - name: Limit ABIs + free disk (CI disk pressure)
        run: |
          # Phone ABIs only — skip x86/x86_64 to avoid runner disk exhaustion
          if [ -f android/gradle.properties ]; then
            sed -i '/^reactNativeArchitectures=/d' android/gradle.properties
            echo 'reactNativeArchitectures=armeabi-v7a,arm64-v8a' >> android/gradle.properties
          fi
          # Drop unused SDK platforms / caches if present
          rm -rf "$ANDROID_HOME/ndk-bundle" 2>/dev/null || true
          rm -rf /usr/share/dotnet 2>/dev/null || true
          rm -rf "$HOME/.gradle/caches/transforms-*" 2>/dev/null || true
          df -h

      - name: Assert Android package + MainActivity
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          GRADLE=android/app/build.gradle
          test -f "$MANIFEST"
          test -f "$GRADLE"
          grep -q 'android:name=".MainActivity"' "$MANIFEST"
          grep -q 'ai.spp.stitch' "$GRADLE"
          grep -q 'android.intent.action.SEND' "$MANIFEST"
          # Expo 54 autolinks via settings plugin — verify resolver, not settings.gradle text.
          npx expo-modules-autolinking resolve --platform android | grep -q 'spp-file-import' \
            || { echo "::error::spp-file-import not in expo-modules-autolinking resolve"; exit 1; }
          MAIN=$(find android -name 'MainActivity.kt' -o -name 'MainActivity.java' | head -n 1)
          if [ -n "$MAIN" ]; then
            grep -q 'sppHandleIncomingShare' "$MAIN" \
              || { echo "::error::MainActivity missing share ingest ($MAIN)"; exit 1; }
            echo "Share ingest OK in $MAIN"
          else
            echo "::error::MainActivity not found after prebuild"
            exit 1
          fi
          if grep -qi 'emergent' "$MANIFEST"; then
            echo "::error::AndroidManifest mentions Emergent"
            exit 1
          fi
          echo "Native identity OK - MainActivity + ai.spp.stitch + spp-file-import"

      - name: Assemble Release APK (embeds JS bundle)
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Package named artifact
        id: pack
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"
          mkdir -p dist
          NAME="${{ steps.meta.outputs.apk_name }}"
          VERSION="${{ steps.meta.outputs.version }}"
          cp "$SRC" "dist/${NAME}"
          cp "$SRC" dist/spp-stitch.apk
          cp "$SRC" "dist/spp-stitch-${VERSION}.apk"
          cp "$SRC" dist/spp-beta.apk
          ls -la dist/
          echo "apk_path=frontend/dist/${NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (stable spp-beta.apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: SPP Stitch ${{ steps.meta.outputs.version }} — Beta APK
          body: |
            **Direct install (Android):**
            https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.release_tag }}/spp-beta.apk

            Latest redirect:
            https://github.com/${{ github.repository }}/releases/latest/download/spp-beta.apk

            Package: `${{ steps.meta.outputs.package }}` · Version `${{ steps.meta.outputs.version }}`
            OTA channel: `beta` (reopen app after install).
          files: |
            frontend/dist/spp-beta.apk
            frontend/dist/spp-stitch-${{ steps.meta.outputs.version }}.apk
            frontend/dist/${{ steps.meta.outputs.apk_name }}
          prerelease: false
          make_latest: true
          overwrite_files: true

      - name: Verify standalone SPP APK (bundle + package)
        run: |
          node ./scripts/verify-spp-apk.mjs "dist/${{ steps.meta.outputs.apk_name }}" ai.spp.stitch
          # Extra: fail if no hermes/js bundle entry
          unzip -Z1 "dist/${{ steps.meta.outputs.apk_name }}" | grep -E 'index\.android\.bundle|\.hbc$|android\.bundle' \
            || { echo "::error::APK missing embedded JS bundle"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: |
            frontend/dist/${{ steps.meta.outputs.apk_name }}
            frontend/dist/spp-stitch.apk
          retention-days: 90
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## Standalone SPP APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ github.event.inputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit short: \`${{ steps.meta.outputs.short }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- applicationId: \`${{ steps.meta.outputs.package }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: **${{ steps.meta.outputs.apk_name }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.release_tag }}/spp-beta.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Note: ${{ github.event.inputs.note }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified: embedded JS bundle + MainActivity + no Emergent shell" >> "$GITHUB_STEP_SUMMARY"

