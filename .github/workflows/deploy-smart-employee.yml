# Experimental Arabic SPP Presentation surface (Governance Option A).
# Not a second product — shared Constitution / Domain Model / engines.
name: Deploy experimental Arabic SPP surface

"on":
  push:
    branches: [main]
    paths:
      - 'smart-employee/**'
      - '.github/workflows/deploy-smart-employee.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-employee
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-employee/package-lock.json

      - run: npm ci

      - run: npm run build

      # secrets.* cannot be used in `if:` — check inside the step instead.
      - name: Deploy to Vercel (optional)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_* secrets not set — skipping Vercel deploy; build artifact still uploaded."
            exit 0
          fi
          npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-employee-dist
          path: smart-employee/dist
